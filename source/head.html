<title>RL Defense Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one study desk. Sticky tab rail on top, a single centred working column below (max 880px), every tool a stack of plain panels. */
:root{
  --bg:#eceff3; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#162030; --muted:#5a6478; --line:#d3d9e2;
  --accent:#1d6b58; --accent-soft:#dcefe8; --review:#b4521c; --review-soft:#f8e6da; --focus:#2b62c9;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --surface:#171c25; --surface-2:#1d2330; --ink:#e5e9f0; --muted:#9aa3b3; --line:#2a3242;
  --accent:#4cb497; --accent-soft:#18332c; --review:#e58a54; --review-soft:#3a2418; --focus:#7aa5ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --surface:#171c25; --surface-2:#1d2330; --ink:#e5e9f0; --muted:#9aa3b3; --line:#2a3242;
  --accent:#4cb497; --accent-soft:#18332c; --review:#e58a54; --review-soft:#3a2418; --focus:#7aa5ff; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:600}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
header.top{padding-block:28px 18px;display:grid;gap:10px}
header.top p{margin:0;color:var(--muted);max-width:62ch}
.stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:13px}
.stat{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.stat b{font-weight:500}
.stat.know{border-color:var(--accent);color:var(--accent)}
.stat.rev{border-color:var(--review);color:var(--review)}
.sync{color:var(--muted);font-size:12px}
a.sync{color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.toprow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.themes{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--surface)}
.themes button{border:0;border-radius:999px;font-size:12px;padding:4px 10px;background:transparent;color:var(--muted);min-height:0}
.themes button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.acct{display:grid;gap:10px;max-width:380px;margin-top:8px}
.acct label{display:grid;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.acct input{font:inherit;font-family:var(--f-body);font-size:16px;text-transform:none;letter-spacing:0;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.pmsg{margin:0;font-size:15px;color:var(--accent);min-height:1.2em}
.pmsg.bad{color:var(--review)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--f-display);font-weight:500;font-size:15px;color:var(--muted);text-decoration:none;padding:12px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
main{padding-block:22px 80px}
section.view{display:grid;gap:16px}
section.view>*,.deck>*,.list>*,.card>*,.figs>*{min-width:0}
.intro{color:var(--muted);margin:0;max-width:65ch}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .label{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
button,.btn{font:inherit;font-family:var(--f-display);font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;line-height:1.3}
button:hover{border-color:var(--muted)}
button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.know{border-color:var(--accent);color:var(--accent)}
button.know[aria-pressed="true"]{background:var(--accent);color:#fff}
button.rev{border-color:var(--review);color:var(--review)}
button.rev[aria-pressed="true"]{background:var(--review);color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
input[type="search"]{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.muted{color:var(--muted)}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.know{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pill.review{border-color:var(--review);color:var(--review);background:var(--review-soft)}
.rich p{margin:.45em 0}
.rich ul,.rich ol{margin:.4em 0;padding-left:1.3em}
.rich li{margin:.2em 0}
.rich code{font-family:var(--f-mono);font-size:.84em;background:var(--surface-2);padding:1px 5px;border-radius:4px;word-break:break-word}
.rich strong{font-weight:600}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:4px 0}
mjx-container.wide{display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle;padding:2px 0}
/* glossary */
.gloss{display:grid;gap:0}
.gitem{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:4px 18px;padding:12px 0;border-bottom:1px solid var(--line)}
.gitem:last-child{border-bottom:0}
.gterm{font-family:var(--f-display);font-weight:600;font-size:16px;min-width:0}
.gterm .pill{margin-top:4px}
.gdef{min-width:0}
@media (max-width:560px){.gitem{grid-template-columns:1fr}}
/* deck */
.deck{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;min-height:260px;display:grid;align-content:start;gap:12px;min-width:0}
.card .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.card .q{font-family:var(--f-display);font-size:clamp(19px,2.6vw,23px);font-weight:600;line-height:1.3}
.card .ans{border-top:1px dashed var(--line);padding-top:12px}
.kw{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.kw button{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border-radius:999px;color:var(--muted)}
.deckbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.deckbar .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.counter{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.hint{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
details.li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;min-width:0}
details.li summary{cursor:pointer;display:flex;gap:10px;align-items:baseline;justify-content:space-between;list-style:none}
details.li summary::-webkit-details-marker{display:none}
details.li summary .t{font-family:var(--f-display);font-weight:600;font-size:16px;min-width:0}
details.li[open] summary{margin-bottom:8px}
.list{display:grid;gap:8px}
.marks{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* derivations */
.steps{display:grid;gap:10px;counter-reset:st;margin:6px 0 0;padding:0;list-style:none}
.steps li{counter-increment:st;display:grid;grid-template-columns:28px 1fr;gap:4px 10px;min-width:0}
.steps li::before{content:counter(st);font-family:var(--f-mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;width:24px;height:24px;display:grid;place-items:center;margin-top:6px}
.steps .m{min-width:0;overflow-x:auto}
.steps .why{grid-column:2;color:var(--muted);font-size:15px;min-width:0}
.goal{margin:4px 0 0}
/* mcq */
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;font-family:var(--f-body);font-size:16px;font-weight:400;padding:10px 14px;display:flex;gap:10px;align-items:baseline}
.opt .l{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.opt.right{border-color:var(--accent);background:var(--accent-soft)}
.opt.wrong{border-color:var(--review);background:var(--review-soft)}
.opt[disabled]{cursor:default;opacity:1;color:var(--ink)}
.expl{margin-top:10px;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0}
.expl.bad{border-left-color:var(--review)}
.score{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
/* weak */
.weak h3{margin-bottom:4px}
.tag{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--review)}
.tag.tip{color:var(--accent)}
footer{color:var(--muted);font-size:13px;padding-block:24px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
/* diagrams */
.dg{margin:12px 0;padding:12px 10px 10px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;min-width:0}
.dg svg{display:block;width:100%;height:auto;max-width:540px;margin:0 auto;font-family:var(--f-mono);font-size:11px;overflow:visible}
.dg text{fill:var(--ink);dominant-baseline:central}
.dg .t-m{fill:var(--muted)} .dg .t-a{fill:var(--accent)} .dg .t-r{fill:var(--review)}
.dg .bx{fill:var(--surface);stroke:var(--ink);stroke-width:1.2}
.dg .bxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.dg .bxr{fill:var(--review-soft);stroke:var(--review);stroke-width:1.2}
.dg .bxm{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.dg .ol{fill:none;stroke:var(--muted);stroke-width:1}
.dg .win{fill:var(--accent);fill-opacity:.16;stroke:var(--accent);stroke-width:2.2}
.dg .ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.dg .lna{stroke:var(--accent)} .dg .lnr{stroke:var(--review)} .dg .lnm{stroke:var(--muted)}
.dg .dash{stroke-dasharray:4 3} .dg .thin{stroke-width:1} .dg .bold{stroke-width:2.2}
.dg .hd,.dg .fi{fill:var(--ink)} .dg .hda,.dg .fa{fill:var(--accent)} .dg .hdr,.dg .fr{fill:var(--review)} .dg .hdm,.dg .fm{fill:var(--muted)}
.dg figcaption{font-family:var(--f-body);font-size:15px;line-height:1.5;color:var(--muted);margin:10px 2px 0;max-width:62ch}
.dg figcaption strong{color:var(--ink)}
.figs{display:grid;gap:0}
.plain{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 10px 10px 0;padding:10px 14px;margin:4px 0 8px}
.plain-h,.exam-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.exam-h{color:var(--muted);margin-top:12px;padding-top:8px;border-top:1px dashed var(--line)}
.plain p{margin:.35em 0}
.dg .band{fill:var(--accent);fill-opacity:.16;stroke:none} .dg .bandr{fill:var(--review);fill-opacity:.16;stroke:none}
.dg svg{cursor:zoom-in}
.dg.zoom{overflow-x:auto}
.dg.zoom svg{width:180%;max-width:none;cursor:zoom-out}
.zoom-hint{display:none;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin:6px 2px 0}
@media (max-width:600px){.zoom-hint{display:block}}
/* deck bottom bar */
.deckbar{position:sticky;bottom:0;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;box-shadow:0 -6px 16px -10px rgba(0,0,0,.25)}
.deckbar .mid{display:flex;gap:8px;justify-content:center;min-width:0}
.deckbar .mid button{flex:1 1 0;max-width:220px}
.deckbar .nav{font-size:18px;padding:6px 14px}
.counter{white-space:nowrap}
.card .meta .counter{margin-left:auto}
.swipe-hint{display:none}
/* comparison tables */
.gsub{display:grid;gap:16px;min-width:0}
.gsub[hidden]{display:none}
.cmpview>*{min-width:0}
.cmp-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.cmp-block h3{margin:0 0 8px;font-size:18px}
.cmp-note{margin:0 0 10px;font-size:14px}
.cmp-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;margin-top:6px}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;line-height:1.4}
table.cmp th,table.cmp td{padding:8px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
table.cmp tr>*:last-child{border-right:0}
table.cmp tbody tr:last-child>*{border-bottom:0}
table.cmp thead th{background:var(--surface-2);font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
table.cmp tbody th{background:var(--surface);font-weight:600;position:sticky;left:0;z-index:1;min-width:110px;max-width:150px}
table.cmp thead th:first-child{position:sticky;left:0;z-index:2}
table.cmp td{min-width:120px}
table.cmp tbody tr:nth-child(even) td{background:var(--surface-2)}
.yn{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid}
.yn.y{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.yn.n{color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.fix{display:inline-block;font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--review);background:var(--review-soft);border-radius:4px;padding:0 5px;margin-left:2px;white-space:nowrap}
.cmp-fix{border-left:4px solid var(--review)}
@media (max-width:600px){.cmp-block{padding:14px 12px;margin-inline:-4px}table.cmp{font-size:13px}table.cmp th,table.cmp td{padding:7px 8px}table.cmp tbody th{min-width:96px;max-width:120px}table.cmp td{min-width:108px}}
/* course map tree */
.cmap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;min-width:0}
.cmap-fig{margin:12px 0}
.cm-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px}
.cm-btns{display:flex;gap:6px}.cm-btns button{font-size:13px;padding:4px 10px}
.cmap ul{list-style:none;margin:0;padding:0}
.cmap .cm-ul .cm-ul{margin-left:10px;padding-left:12px;border-left:2px solid var(--line)}
.cm-li{position:relative;padding:5px 0 0}
.cm-ul .cm-ul>.cm-li::before{content:"";position:absolute;left:-12px;top:22px;width:10px;border-top:2px solid var(--line)}
.cm-ul .cm-ul>.cm-li.cm-has-edge::before{top:40px}
.cm-closed>.cm-ul{display:none}
.cm-edge{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.02em;margin:2px 0 3px 26px}
.cm-row{display:flex;align-items:flex-start;gap:6px;min-width:0}
.cm-tog,.cm-leaf{flex:0 0 20px;width:20px;height:20px;margin-top:8px}
.cm-tog{padding:0;border-radius:6px;font-size:13px;line-height:18px;text-align:center;color:var(--muted)}
.cm-tog::before{content:"\2212"}.cm-tog[aria-expanded="false"]::before{content:"+"}
.cm-leaf{display:inline-block}.cm-leaf::before{content:"";display:block;width:6px;height:6px;border-radius:50%;margin:7px auto 0;background:var(--line)}
.cm-node{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;border-left:4px solid var(--wc);padding:6px 10px;border-radius:8px;background:var(--surface)}
.cm-node[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent);border-left-color:var(--wc);box-shadow:0 0 0 2px var(--accent)}
.cm-q{background:var(--surface-2);border-style:dashed;border-left-style:solid}
.cm-q .cm-t{font-weight:500}
.cm-t{font-weight:700;font-size:15px}
.cm-f{font-size:12.5px;color:var(--muted);font-weight:400;line-height:1.3}
.cm-sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;max-width:720px;margin:0 auto;max-height:62vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-top:4px solid var(--accent);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:14px 16px calc(18px + env(safe-area-inset-bottom));animation:cmUp .18s ease-out}
.cm-sheet[hidden]{display:none}
@keyframes cmUp{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.cm-sheet{animation:none}}
.cm-x{float:right;margin:0 0 6px 10px;font-size:13px;padding:4px 10px}
.cm-sbody .cm-dh strong{font-size:17px}
.cm-dh{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:4px}
.cm-eq{overflow-x:auto;overflow-y:hidden;margin:6px 0;font-size:14px}
.cm-use{margin-top:6px;font-size:14.5px}.cm-uh{display:block;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.cm-gl{margin-top:8px;font-size:13px;padding:4px 10px}
@media (max-width:600px){.cmap{padding:12px 10px 8px;margin-inline:-4px}.cmap .cm-ul .cm-ul{margin-left:8px;padding-left:9px}.cm-ul .cm-ul>.cm-li::before{left:-9px;width:7px}.cm-edge{margin-left:24px}}
/* phone */
@media (max-width:600px){
  body{font-size:16px}
  header.top{padding-block:16px 12px;gap:8px}
  header.top p{font-size:15px}
  h1{font-size:26px}
  main{padding-block:14px 40px}
  section.view{gap:12px}
  .intro{font-size:15px}
  header.top p,#v-cards .intro,#v-derivations .intro,#v-models .intro{display:none}
  .stats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
  .stats::-webkit-scrollbar{display:none}
  .stat,.sync{white-space:nowrap;flex:0 0 auto}
  .toolbar{flex-wrap:nowrap;gap:8px}
  .toolbar .label{flex:0 0 auto;width:42px;font-size:11px;margin:0}
  .chips{flex:1 1 auto;min-width:0;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px;padding-bottom:2px}
  .toolbar .score{display:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{white-space:nowrap;flex:0 0 auto}
  .panel{padding:14px 14px}
